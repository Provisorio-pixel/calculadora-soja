name: Gerar icones
on:
  push:
    paths: ['icon.svg']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - run: |
          for s in 180 192 512; do rsvg-convert -w $s -h $s icon.svg -o icon-$s.png; done
          ls -la icon-*.png
      - run: |
          git config user.name "icon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-*.png
          git diff --cached --quiet || (git commit -m "Gera ícones PNG" && git push)
