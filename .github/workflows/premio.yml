name: Atualizar premio Paranagua
on:
  schedule:
    - cron: '7 13 * * 1-5'    # ~10h Brasília
    - cron: '37 21 * * 1-5'   # ~18h30 Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  premio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/premio.py
      - run: |
          git config user.name "premio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premio.json
          git diff --cached --quiet || (git commit -m "Atualiza prêmio Paranaguá" && git push)
